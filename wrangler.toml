# ===========================================================================
# wrangler.toml — Cloudflare Pages + D1 (Sprint 6)
#
# Sprint 6 split the repo in two (PROJECT_PLAN §11):
#   public/     → the only directory Pages uploads, i.e. the only directory a
#                 browser can reach. index.html, styles.css, app.js,
#                 manifest.json, sw.js and icons/ live here and nowhere else.
#   repo root   → PROJECT_PLAN.md, healthcheck.js, wrangler.toml, migrations/,
#                 tools/ — build and config artefacts. They are outside the
#                 build output, so Pages never uploads them and no URL can
#                 fetch them.
#
# functions/ deliberately stays at the repo root: Pages compiles it from the
# project root, not from the output directory, and mounts it at /api/*.
#
# First-time setup
#   wrangler d1 create benja-calendar          # copy the id below
#   wrangler d1 migrations apply benja-calendar --remote
#   wrangler pages deploy
#
# Google Calendar (Sprint 6) needs four secrets on the Pages project:
#   wrangler pages secret put GOOGLE_CLIENT_ID
#   wrangler pages secret put GOOGLE_CLIENT_SECRET
#   wrangler pages secret put GOOGLE_REDIRECT_URI          # …/api/gcal/auth
#   wrangler pages secret put GOOGLE_BUSINESS_CALENDAR_ID  # the business calendar
# Until they are set, /api/gcal/* answers 503 gcal_not_configured and the app
# keeps working exactly as it did in Sprint 5 (§7.4e).
#
# Web Push (Sprint 11, §7.4m) needs four more secrets:
#   node tools/gen-vapid.js                       # prints the P-256 key pair
#   wrangler pages secret put VAPID_PUBLIC_KEY
#   wrangler pages secret put VAPID_PRIVATE_KEY
#   wrangler pages secret put VAPID_SUBJECT       # mailto:you@example.com
#   wrangler pages secret put PUSH_DISPATCH_SECRET
#   wrangler d1 migrations apply benja-calendar --remote   # 0004 adds the two push tables
# Until they are set, /api/push/* answers 503, the client stays on its local
# 30-second scan, and nothing else changes.
#
# NOTE: there is deliberately no [triggers] block here. Cloudflare PAGES has no
# scheduled handler — a cron declared on a Pages project never fires. The
# reminder clock is a separate Worker in tools/push-cron-worker/, which POSTs
# /api/push/dispatch once a minute with PUSH_DISPATCH_SECRET.
#
# Until database_id is filled in, /api/* answers 500 no_binding and the client
# stays on its local store — the app is fully usable either way (§8).
# ===========================================================================

name = "benja-calendar-app"
compatibility_date = "2026-07-27"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "benja-calendar"
database_id = "fa6d103d-b10d-4db0-a719-1c8420d2053a"
migrations_dir = "migrations"
